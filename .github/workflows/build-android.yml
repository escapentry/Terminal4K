name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Terminal (com.thallyace.terminal)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Android project root
        id: android_project
        run: |
          if [ -f "android/settings.gradle.kts" ]; then
            echo "dir=android" >> "$GITHUB_OUTPUT"
          elif [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "Error: Could not find settings.gradle.kts in repository root or android/" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK, NDK, and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 cmake;3.22.1 ndk;27.0.12077973'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug & Release APKs
        working-directory: ${{ steps.android_project.outputs.dir }}
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Terminal-com.thallyace.terminal-debug
          path: ${{ steps.android_project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK (Unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: Terminal-com.thallyace.terminal-release-unsigned
          path: ${{ steps.android_project.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
